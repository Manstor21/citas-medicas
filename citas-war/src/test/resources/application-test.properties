# Perfil de tests: base de datos en memoria H2, sin MySQL ni credenciales reales.
# dialecto H2 en lugar del MySQLDialect de produccion
# el sufijo aleatorio aísla la base en memoria de cada contexto de test (@SpringBootTest)
spring.datasource.url=jdbc:h2:mem:citas-test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
